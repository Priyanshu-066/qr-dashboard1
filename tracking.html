<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Registration</title>

  <style>
    body{
  margin:0;
  font-family:Arial;
  background:#fdf3d1;
}

.form-wrapper{
  width:90%;
  max-width:700px;
  margin:40px auto;
  background:white;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,0.08);
  overflow:hidden;
}

.form-header{
  text-align:center;
  padding:40px 20px 25px;
}

.center-logo{
  width:70px;
}

.form-header h1{
  font-size:42px;
  margin:15px 0 10px;
}

.form-header p{
  color:#555;
}

form{
  padding:30px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:18px;
}

.row3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;
  margin-bottom:18px;
}

input{
  width:100%;
  padding:16px 14px;
  border:none;
  background:#eef2f7;
  border-radius:10px;
  font-size:15px;
  box-sizing:border-box;
  margin:0;
}

button{
  width:100%;
  padding:16px;
  border:none;
  background:#f4b400;
  border-radius:12px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.full-width {
  margin-bottom: 18px;
}

@media(max-width:768px){

  .row,.row3{
    grid-template-columns:1fr;
  }

  .form-header h1{
    font-size:32px;
  }

}

select {
  width: 100%;
  padding: 16px 14px;
  border: none;
  background: #eef2f7;
  border-radius: 10px;
  font-size: 15px;
  box-sizing: border-box;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #22304a;
}

label span {
  color: red;
}

/* ── Pincode status message ── */
.pincode-status {
  font-size: 12px;
  margin-top: 6px;
  min-height: 16px;
  line-height: 1.3;
  transition: opacity 0.2s ease;
}

.pincode-status:empty {
  opacity: 0;
}

.pincode-status.loading {
  color: #888;
}

.pincode-status.success {
  color: #2a7a2a;
}

.pincode-status.error {
  color: #c0392b;
}

/* Spinner for loading state */
.pincode-status.loading::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 2px solid #bbb;
  border-top-color: #555;
  border-radius: 50%;
  animation: pin-spin 0.6s linear infinite;
  margin-right: 6px;
  vertical-align: middle;
}

@keyframes pin-spin {
  to { transform: rotate(360deg); }
}

/* Highlight auto-filled readonly fields */
#city[readonly]:not(:placeholder-shown),
#state[readonly]:not(:placeholder-shown) {
  background: #e8f5e9;
  color: #1b5e20;
}
  </style>
</head>
<body>

<div class="form-wrapper">

<div class="form-header">
  <img src="images/logo.jpeg" class="center-logo">
  <h1>Kalyan Centenary 2026</h1>
  <p>Subscription Form</p>
</div>

<form id="customerForm">

<div class="row">
  <div>
    <label>First Name <span>*</span></label>
    <input type="text" id="name" required>
  </div>

  <div>
    <label>Last Name <span>*</span></label>
    <input type="text" id="lastname" required>
  </div>
</div>

<div>
  <label>Address 1 <span>*</span></label>
  <input type="text" id="address1" class="full-width" required>
</div>

<div>
  <label>Address 2 <span>*</span></label>
  <input type="text" id="address2" class="full-width" required>
</div>

<div>
  <label>Address 3</label>
  <input type="text" id="address3" class="full-width">
</div>

<div class="row3">
  <div>
    <label>Pincode <span>*</span></label>
    <input type="text" id="pincode" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="postal-code" required>
    <div id="pincode-status" class="pincode-status" aria-live="polite"></div>
  </div>

  <div>
    <label>City <span>*</span></label>
    <input type="text" id="city" readonly>
  </div>

  <div>
    <label>State <span>*</span></label>
    <input type="text" id="state" readonly>
  </div>
</div>

<div class="row">
  <div>
    <label>Phone <span>*</span></label>
    <input type="tel" id="phone" required>
  </div>

  <div>
    <label>Email</label>
    <input type="email" id="email">
  </div>
</div>

<input type="hidden" id="wid">

<button type="submit">Proceed to Pay ₹500 →</button>

</form>

</div>

<script src="../js/tracking.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Login</title>

<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to right,#f5f6fa,#efe9dd);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.box{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:50px 30px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

img{
  width:70px;
  margin-bottom:15px;
}

h2{
  margin-bottom:30px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:16px;
  margin-bottom:18px;
  background:#f4b400;
  color:#000;
  text-decoration:none;
  border-radius:12px;
  font-weight:600;
  font-size:22px;
  transition:0.3s;
  text-align:center;
}
.btn:hover{
  background:#e0a800;
}

@media(max-width:768px){

  .box{
    padding:40px 20px;
  }

  h2{
    font-size:32px;
  }

  .btn{
    font-size:18px;
    padding:15px;
  }

  img{
    width:80px;
  }

}
</style>
</head>

<body>

<div class="box">

  <img src="images/logo.jpeg">

  <h2>Select Login Type</h2>

  <a class="btn" href="admin-login.html">
    Login as Admin
  </a>

  <a class="btn" href="login.html">
    Login as Wholesaler
  </a>

</div>

</body>
</html>
